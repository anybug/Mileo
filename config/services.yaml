    #           event: 'postUpdate'
    
    App\EventListener\VehiculeListener:
        tags:
            - name: 'doctrine.event_listener'
              event: 'postPersist'
            - name: 'doctrine.event_listener'
              event: 'postUpdate'
    
    App\EventListener\OrderListener:
        tags:
            - name: 'doctrine.event_listener'
              event: 'postPersist'
            - name: 'doctrine.event_listener'
              event: 'postUpdate'
